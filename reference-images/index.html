<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FME Flow UI Reference</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="chrome">

  <!-- Sidebar (dark zone) -->
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <h2>Datum-Sync</h2>
      <div class="subtitle">FME Flow UI Reference</div>
    </div>
    <div class="nav-section">Filters</div>
    <div class="nav-item active" data-filter="all" data-action="filter">
      <span>All Pages</span>
      <span class="count" id="countAll">21</span>
    </div>
    <div class="nav-item" data-filter="starred" data-action="filter">
      <span>Starred</span>
      <span class="count" id="countStarred">0</span>
    </div>
    <div class="nav-item" data-filter="annotated" data-action="filter">
      <span>Annotated</span>
      <span class="count" id="countAnnotated">0</span>
    </div>
    <div class="nav-section">Pages</div>
    <div id="pageNav"></div>
  </nav>

  <!-- Topbar (light zone) -->
  <header class="topbar">
    <h1 id="viewTitle">All Pages</h1>
    <div class="stats">
      <span><span class="stat-val" id="statTotal">21</span> screenshots</span>
      <span><span class="stat-val" id="statStarred">0</span> starred</span>
      <span><span class="stat-val" id="statAnnotated">0</span> annotated</span>
    </div>
    <div class="action-group">
      <button class="action-btn" data-action="import">Import</button>
      <button class="action-btn" data-action="export-json">Export JSON</button>
      <button class="action-btn primary" data-action="export-md">Export Picks</button>
    </div>
  </header>

  <!-- Content (light zone) -->
  <main class="content" id="content">
    <div class="filter-bar" id="filterBar"></div>
    <div class="gallery" id="gallery"></div>
  </main>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" data-action="lb-close">&times;</button>
  <button class="lb-nav lb-prev" data-action="lb-prev">&lsaquo;</button>
  <button class="lb-nav lb-next" data-action="lb-next">&rsaquo;</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-caption" id="lbCaption"></div>
  <div class="lb-note" id="lbNote"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importInput" accept=".json" class="hidden">

<script src="assets/app.js"></script>
</body>
</html>
