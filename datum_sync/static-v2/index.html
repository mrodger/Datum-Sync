<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum-Sync</title>
<link rel="stylesheet" href="/v2/style.css">
</head>
<body>

<div id="signin" class="signin" hidden>
  <form id="signin-form" autocomplete="on">
    <h1>Datum<span>-Sync</span></h1>
    <label for="signin-name">Account</label>
    <input id="signin-name" name="name" autocomplete="username" required autofocus>
    <label for="signin-password">Password</label>
    <input id="signin-password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="signin-submit">Sign in</button>
    <p id="signin-error" class="error" role="alert" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <div class="brand">
    <button id="nav-toggle" type="button" aria-label="Collapse navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <span class="brand-name">Datum-Sync</span>
  </div>

  <header class="topbar">
    <div class="engines" id="engines"></div>
    <div class="tb-right">
      <button type="button" class="tb-icon" title="Help" aria-label="Help">?</button>
      <div class="tb-user">
        <button type="button" class="tb-avatar" id="avatar-btn" aria-label="Account menu" aria-expanded="false"></button>
        <div class="tb-dropdown" id="tb-dropdown" hidden>
          <div class="tb-acct" id="account"></div>
          <button type="button" id="signout">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="sidebar" id="nav" aria-label="Sections"></nav>
  <main class="view" id="view"></main>
</div>

<script src="/v2/nav-collapse.js"></script>
<script src="/v2/table.js"></script>
<script src="/v2/app.js"></script>
</body>
</html>
